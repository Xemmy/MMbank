name: Test & Build Workflow

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # A failing test fails this job, and with it the workflow (see
      # final-status). The APK is still built for inspection -- build-apk
      # runs unless the workflow was cancelled -- but it is never published
      # as a release.
      - name: Run unit tests
        id: unit_tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -x lint

      - name: Summarize failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          lines = []
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          message = (node.get("message") or "").strip().splitlines()
                          first = message[0][:200] if message else tag
                          lines.append(f"{case.get('classname')}.{case.get('name')}: {first}")
          if not lines:
              lines = ["No failing test cases found in the XML results -- the failure is "
                       "probably a compile error. Check the 'Run unit tests' step log."]
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as out:
                  out.write("## Failing unit tests\n\n")
                  out.writelines(f"- `{line}`\n" for line in lines)
          PY

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    name: Build APK (with retries)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-unit-tests
    # Build even when unit tests fail, so the APK of a red commit can still be
    # inspected. The release steps below are gated on the tests separately.
    if: ${{ !cancelled() }}
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # packages: '' is load-bearing. Without it the action runs
      # `sdkmanager tools` by default, and Google has removed the obsolete
      # `tools` package from the SDK repository -- so the step dies with
      # "Warning: Failed to find package 'tools'" before a single Gradle task
      # runs, taking the whole gating build with it. The runner image already
      # ships the SDK, so skipping the default install costs nothing.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          api-levels: '35'
          ndk-version: '26.1.10909125'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Every run block below uses `set -o pipefail` so that a Gradle failure
      # piped through `tee` is not masked by tee's own (always-zero) exit code.

      - name: Build Debug APK - Attempt 1
        id: build_attempt_1
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Building APK (Attempt 1)..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_1.log

      - name: Show Attempt 1 failure output
        if: steps.build_attempt_1.outcome == 'failure'
        run: tail -n 150 build_attempt_1.log

      - name: Clean gradle and retry - Attempt 2
        id: build_attempt_2
        if: steps.build_attempt_1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Cleaning and rebuilding (Attempt 2)..."
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_2.log

      - name: Show Attempt 2 failure output
        if: steps.build_attempt_2.outcome == 'failure'
        run: tail -n 150 build_attempt_2.log

      - name: Stop daemon and retry - Attempt 3
        id: build_attempt_3
        if: steps.build_attempt_2.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Stopping daemon and rebuilding (Attempt 3)..."
          ./gradlew --stop
          sleep 5
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_3.log

      - name: Show Attempt 3 failure output
        if: steps.build_attempt_3.outcome == 'failure'
        run: tail -n 150 build_attempt_3.log

      - name: Full reset and retry - Attempt 4
        id: build_attempt_4
        if: steps.build_attempt_3.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Full reset and rebuild (Attempt 4)..."
          rm -rf ~/.gradle
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_4.log

      - name: Show Attempt 4 failure output
        if: steps.build_attempt_4.outcome == 'failure'
        run: tail -n 150 build_attempt_4.log

      - name: Verify build success
        run: |
          if [ "${{ steps.build_attempt_1.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 1"
            exit 0
          elif [ "${{ steps.build_attempt_2.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 2"
            exit 0
          elif [ "${{ steps.build_attempt_3.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 3"
            exit 0
          elif [ "${{ steps.build_attempt_4.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 4"
            exit 0
          else
            echo "Build failed on all 4 attempts"
            echo "Attempt 1: ${{ steps.build_attempt_1.outcome }}"
            echo "Attempt 2: ${{ steps.build_attempt_2.outcome }}"
            echo "Attempt 3: ${{ steps.build_attempt_3.outcome }}"
            echo "Attempt 4: ${{ steps.build_attempt_4.outcome }}"
            exit 1
          fi

      - name: Check APK exists
        run: |
          APK_PATH=$(find app/build/outputs -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mmbank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Merges to main get a durable, non-expiring download link -- the
      # 7-day artifact above is for quick access to in-progress claude/**
      # builds, not for something you'd want to sideload weeks later.
      - name: Extract version for release
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.lint-and-unit-tests.result == 'success'
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.lint-and-unit-tests.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MMbank ${{ steps.version.outputs.tag }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Release APK
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Building Release APK..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build_release.log

      - name: Upload Release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mmbank-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate build report
        if: always()
        run: |
          {
            echo "## APK Build Report"
            echo ""
            echo "### Build Attempts"
            echo "| Attempt | Status |"
            echo "|---------|--------|"
            echo "| 1 | ${{ steps.build_attempt_1.outcome }} |"
            echo "| 2 (clean) | ${{ steps.build_attempt_2.outcome }} |"
            echo "| 3 (daemon stop) | ${{ steps.build_attempt_3.outcome }} |"
            echo "| 4 (full reset) | ${{ steps.build_attempt_4.outcome }} |"
            echo ""
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
              echo "### Success"
              echo "Debug APK: **$(numfmt --to=iec-i --suffix=B $SIZE 2>/dev/null || echo "$SIZE bytes")**"
            else
              echo "### Failed"
              echo "APK not found after all attempts"
            fi
          } >> $GITHUB_STEP_SUMMARY

  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [ lint-and-unit-tests, build-apk ]
    if: always()

    steps:
      - name: Check overall build status
        run: |
          TESTS="${{ needs.lint-and-unit-tests.result }}"
          APK="${{ needs.build-apk.result }}"
          echo "Unit tests: $TESTS"
          echo "APK build:  $APK"
          if [ "$TESTS" = "success" ] && [ "$APK" = "success" ]; then
            echo "MMbank: unit tests passed and the APK built."
            exit 0
          fi
          [ "$TESTS" != "success" ] && echo "Unit tests did not pass -- see 'Summarize failing tests'."
          [ "$APK" != "success" ] && echo "The APK build failed."
          exit 1
