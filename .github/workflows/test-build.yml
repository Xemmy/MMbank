name: Test & Build Workflow

on:
  push:
    branches: [ main, claude/** ]
    # Docs-only pushes change no APK behaviour, so don't spend a run on them.
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (build + configuration cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # A failing test fails this job, and with it the workflow (see
      # final-status). The APK is still built for inspection -- build-apk
      # runs unless the workflow was cancelled -- but it is never published
      # as a release.
      - name: Run unit tests
        id: unit_tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -x lint

      - name: Summarize failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          lines = []
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          message = (node.get("message") or "").strip().splitlines()
                          first = message[0][:200] if message else tag
                          lines.append(f"{case.get('classname')}.{case.get('name')}: {first}")
          if not lines:
              lines = ["No failing test cases found in the XML results -- the failure is "
                       "probably a compile error. Check the 'Run unit tests' step log."]
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as out:
                  out.write("## Failing unit tests\n\n")
                  out.writelines(f"- `{line}`\n" for line in lines)
          PY

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # No `needs`: tests and the build run side by side. A red commit's APK
    # can still be inspected; the publish job gates releases on the tests.
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (build + configuration cache)
        uses: gradle/actions/setup-gradle@v4

      # packages: '' is load-bearing. Without it the action runs
      # `sdkmanager tools` by default, and Google has removed the obsolete
      # `tools` package from the SDK repository -- so the step dies with
      # "Warning: Failed to find package 'tools'" before a single Gradle task
      # runs, taking the whole gating build with it. The runner image already
      # ships the SDK, so skipping the default install costs nothing.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          api-levels: '35'
          ndk-version: '26.1.10909125'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Every run block below uses `set -o pipefail` so that a Gradle failure
      # piped through `tee` is not masked by tee's own (always-zero) exit code.

      - name: Build Debug APK - Attempt 1
        id: build_attempt_1
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Building APK (Attempt 1)..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_1.log

      - name: Show Attempt 1 failure output
        if: steps.build_attempt_1.outcome == 'failure'
        run: tail -n 150 build_attempt_1.log

      - name: Clean gradle and retry - Attempt 2
        id: build_attempt_2
        if: steps.build_attempt_1.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Cleaning and rebuilding (Attempt 2)..."
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_attempt_2.log

      - name: Show Attempt 2 failure output
        if: steps.build_attempt_2.outcome == 'failure'
        run: tail -n 150 build_attempt_2.log

      - name: Verify build success
        run: |
          if [ "${{ steps.build_attempt_1.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 1"
          elif [ "${{ steps.build_attempt_2.outcome }}" = "success" ]; then
            echo "Build succeeded on Attempt 2 (after clean)"
          else
            echo "Build failed on both attempts"
            exit 1
          fi

      - name: Check APK exists
        run: |
          APK_PATH=$(find app/build/outputs -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "APK found at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Name the APK
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MMbank-${VERSION_NAME}-${VERSION_CODE}.apk"

      # The publish job turns this into a direct .apk download; the artifact
      # itself is always served by GitHub as a zip and expires after 7 days.
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mmbank-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: build_attempt_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate build report
        if: always()
        run: |
          {
            echo "## APK Build Report"
            echo ""
            echo "### Build Attempts"
            echo "| Attempt | Status |"
            echo "|---------|--------|"
            echo "| 1 | ${{ steps.build_attempt_1.outcome }} |"
            echo "| 2 (clean) | ${{ steps.build_attempt_2.outcome }} |"
            echo ""
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
              echo "### Success"
              echo "Debug APK: **$(numfmt --to=iec-i --suffix=B $SIZE 2>/dev/null || echo "$SIZE bytes")**"
            else
              echo "### Failed"
              echo "APK not found after all attempts"
            fi
          } >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish APK
    runs-on: ubuntu-latest
    needs: [ lint-and-unit-tests, build-apk ]
    # Only a green, pushed commit gets a download link.
    if: ${{ github.event_name == 'push' && needs.lint-and-unit-tests.result == 'success' && needs.build-apk.result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: mmbank-debug-apk
          path: dist

      - name: Publish release
        run: |
          set -euo pipefail
          APK=$(ls dist/MMbank-*.apk | head -1)
          BASE=$(basename "$APK" .apk)
          VERSION_NAME=$(echo "$BASE" | sed -E 's/^MMbank-(.*)-[0-9]+$/\1/')
          SHORT=${GITHUB_SHA::7}
          REPO="${GITHUB_REPOSITORY}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="v${VERSION_NAME}"
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "::warning::Release $TAG already exists -- version not bumped, skipping publish."
              echo "### Not published" >> "$GITHUB_STEP_SUMMARY"
              echo "Release \`$TAG\` already exists: bump versionName/versionCode in app/build.gradle.kts." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cp "$APK" "dist/MMbank-${TAG}.apk"
            gh release create "$TAG" "dist/MMbank-${TAG}.apk" --repo "$REPO" \
              --target "$GITHUB_SHA" --title "MMbank ${TAG} (${SHORT})" --generate-notes
            {
              echo "### Release"
              echo "https://github.com/${REPO}/releases/download/${TAG}/MMbank-${TAG}.apk"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            SLUG=${GITHUB_REF_NAME//\//-}
            TAG="dev-${SLUG}"
            cp "$APK" dist/MMbank-dev.apk
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag -y || true
            gh release create "$TAG" "$APK" dist/MMbank-dev.apk --repo "$REPO" \
              --prerelease --target "$GITHUB_SHA" \
              --title "MMbank dev ${VERSION_NAME} (${SHORT})" \
              --notes "Branch ${GITHUB_REF_NAME} at ${SHORT}. Unit tests passed. Debug build signed with the shared debug key, so it installs over the previous one."
            {
              echo "### Direct APK download"
              echo ""
              echo "https://github.com/${REPO}/releases/download/${TAG}/MMbank-dev.apk"
              echo ""
              echo "Versioned file and notes: https://github.com/${REPO}/releases/tag/${TAG}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [ lint-and-unit-tests, build-apk ]
    # Not always(): a run superseded by a newer push (cancel-in-progress) is
    # cancelled, and should read as cancelled rather than as a failure.
    if: ${{ !cancelled() }}

    steps:
      - name: Check overall build status
        run: |
          TESTS="${{ needs.lint-and-unit-tests.result }}"
          APK="${{ needs.build-apk.result }}"
          echo "Unit tests: $TESTS"
          echo "APK build:  $APK"
          if [ "$TESTS" = "success" ] && [ "$APK" = "success" ]; then
            echo "MMbank: unit tests passed and the APK built."
            exit 0
          fi
          [ "$TESTS" != "success" ] && echo "Unit tests did not pass -- see 'Summarize failing tests'."
          [ "$APK" != "success" ] && echo "The APK build failed."
          exit 1
