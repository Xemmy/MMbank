name: Test & Build Workflow

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon -x lint
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build-apk:
    name: Build APK (with retries)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-unit-tests
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '35'
          ndk-version: '26.1.10909125'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK - Attempt 1
        id: build_attempt_1
        continue-on-error: true
        run: |
          echo "🔨 Building APK (Attempt 1)..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -50

      - name: Clean gradle and retry - Attempt 2
        id: build_attempt_2
        if: steps.build_attempt_1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "🔄 Cleaning and rebuilding (Attempt 2)..."
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Stop daemon and retry - Attempt 3
        id: build_attempt_3
        if: steps.build_attempt_2.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "🛑 Stopping daemon and rebuilding (Attempt 3)..."
          ./gradlew --stop
          sleep 5
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Full reset and retry - Attempt 4
        id: build_attempt_4
        if: steps.build_attempt_3.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "♻️  Full reset and rebuild (Attempt 4)..."
          rm -rf ~/.gradle
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Verify build success
        run: |
          if [ "${{ steps.build_attempt_1.outcome }}" = "success" ]; then
            echo "✅ Build succeeded on Attempt 1"
            exit 0
          elif [ "${{ steps.build_attempt_2.outcome }}" = "success" ]; then
            echo "✅ Build succeeded on Attempt 2"
            exit 0
          elif [ "${{ steps.build_attempt_3.outcome }}" = "success" ]; then
            echo "✅ Build succeeded on Attempt 3"
            exit 0
          elif [ "${{ steps.build_attempt_4.outcome }}" = "success" ]; then
            echo "✅ Build succeeded on Attempt 4"
            exit 0
          else
            echo "❌ Build failed on all 4 attempts"
            echo "Attempt 1: ${{ steps.build_attempt_1.outcome }}"
            echo "Attempt 2: ${{ steps.build_attempt_2.outcome }}"
            echo "Attempt 3: ${{ steps.build_attempt_3.outcome }}"
            echo "Attempt 4: ${{ steps.build_attempt_4.outcome }}"
            exit 1
          fi

      - name: Check APK exists
        run: |
          APK_PATH=$(find app/build/outputs -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "✅ APK found at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mmbank-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        id: build_release
        continue-on-error: true
        run: |
          echo "📦 Building Release APK..."
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tail -30

      - name: Upload Release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mmbank-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate build report
        if: always()
        run: |
          {
            echo "## 📱 APK Build Report"
            echo ""
            echo "### Build Attempts"
            echo "| Attempt | Status |"
            echo "|---------|--------|"
            echo "| 1 | ${{ steps.build_attempt_1.outcome }} |"
            echo "| 2 (clean) | ${{ steps.build_attempt_2.outcome }} |"
            echo "| 3 (daemon stop) | ${{ steps.build_attempt_3.outcome }} |"
            echo "| 4 (full reset) | ${{ steps.build_attempt_4.outcome }} |"
            echo ""
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
              echo "### ✅ Success"
              echo "Debug APK: **$(numfmt --to=iec-i --suffix=B $SIZE 2>/dev/null || echo "$SIZE bytes")**"
            else
              echo "### ❌ Failed"
              echo "APK not found after all attempts"
            fi
          } >> $GITHUB_STEP_SUMMARY

  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [ lint-and-unit-tests, build-apk ]
    if: always()

    steps:
      - name: Check overall build status
        run: |
          if [ "${{ needs.build-apk.result }}" = "success" ]; then
            echo "✅ MMbank APK built successfully!"
            exit 0
          else
            echo "❌ MMbank APK build failed"
            exit 1
          fi
