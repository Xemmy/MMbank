<!-- UAE Dirham (AED) symbol — national-palette badge variant.
     White badge, black letterform, and the two strike bars carrying the flag's
     green (#00732F) and red (#FF0000). For standalone/branding use on light or
     mixed surfaces; inside the app's dark theme, amounts use the currentColor
     version (aed-dirham.svg) so the symbol matches each amount's color. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" role="img" aria-label="UAE Dirham">
  <rect width="24" height="24" rx="5.5" fill="#FFFFFF"/>
  <g transform="translate(3.8 2.16) scale(0.82)">
    <path fill-rule="evenodd" fill="#000000" d="M3.4 0.4 H9 C14.85 0.4 19.6 5.59 19.6 12 C19.6 18.41 14.85 23.6 9 23.6 H3.4 Z M6 3 H9 C13.42 3 17 7.03 17 12 C17 16.97 13.42 21 9 21 H6 Z"/>
    <path fill="#00732F" d="M0 7.55 H16.1 V9.75 H0 Z"/>
    <path fill="#FF0000" d="M0 14.25 H16.1 V16.45 H0 Z"/>
  </g>
</svg>
